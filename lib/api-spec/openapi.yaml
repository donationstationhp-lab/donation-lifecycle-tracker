        id: { type: string }
        transferId: { type: string }
        fromStatus: { type: ["string", "null"] }
        toStatus: { type: string }
        by: { type: string }
        notes: { type: ["string", "null"] }
        timestamp: { type: string, format: date-time }
    ClaimSummary:
      type: object
      required: [id, accountId, itemId, status]
      properties:
        id: { type: string }
        accountId: { type: string }
        itemId: { type: string }
        status: { type: string }
    TransferDetail:
