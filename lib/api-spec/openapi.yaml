      properties:
        id: { type: string }
        claimId: { type: string }
        accountId: { type: string }
        itemId: { type: string }
        status: { type: string, enum: [planned, released, received, cancelled] }
        releasedBy: { type: ["string", "null"] }
        receivedBy: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransferInput:
      type: object
      required: [claimId, accountId, itemId]
      properties:
        claimId: { type: string }
        accountId: { type: string }
        itemId: { type: string }
        notes: { type: string }
    TransferHistoryEntry:
