        category:
          type: string
        tier:
          type: string
          enum: [T, I, E, R]
        condition:
          type: string
          enum: [good, fair, poor]
        donor:
          type: string
        recipient:
          type: string
        location:
          type: string
        expiryDate:
          type: string
          format: date
        temperatureZone:
          type: string
          enum: [ambient, refrigerated, frozen]
          default: ambient
        weight:
          type: number
        origin:
          type: string
        lotNumber:
          type: string
        powerConnectionReading:
          type: string

    DonationItemUpdate:
