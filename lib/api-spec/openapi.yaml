openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Donation Station API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: items
    description: Donation item operations
  - name: dashboard
    description: Dashboard and summary operations
  - name: routes
    description: Delivery route operations
  - name: pickups
    description: Donation pickup verification operations
  - name: flags
    description: Pickup phone and address flag operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List donation items
      parameters:
        - name: stage
          in: query
          schema:
            type: string
            enum: [intake, qc, storage, distributed]
        - name: tier
          in: query
          schema:
            type: string
            enum: [T, I, E, R]
        - name: category
          in: query
          schema:
            type: string
        - name: temperatureZone
          in: query
          schema:
            type: string
            enum: [ambient, refrigerated, frozen]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonationItem"
    post:
      operationId: createItem
      tags: [items]
      summary: Create a new donation item (intake)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationItem"

  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get a donation item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationItemDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update a donation item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Delete a donation item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /items/{id}/stage:
    patch:
      operationId: advanceItemStage
      tags: [items]
      summary: Advance item to a new stage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageAdvance"
      responses:
        "200":
          description: Stage updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /items/expiring:
    get:
      operationId: listExpiringItems
      tags: [items]
      summary: List items with expiry urgency
      responses:
        "200":
          description: Expiring items grouped by urgency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiringItemsResponse"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Dashboard summary data
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List delivery routes
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryRoute"
    post:
      operationId: createRoute
      tags: [routes]
      summary: Create a delivery route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRouteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"

  /routes/{id}:
    get:
      operationId: getRoute
      tags: [routes]
      summary: Get a delivery route by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Route found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRouteDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRoute
      tags: [routes]
      summary: Update a delivery route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRouteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRoute
      tags: [routes]
      summary: Delete a delivery route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pickups:
    get:
      operationId: listPickups
      tags: [pickups]
      summary: List pickup requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unverified, contact_made, confirmed, dispatched, completed, no_show, false_address, cancelled, closed_no_response]
        - name: flagged
          in: query
          schema:
            type: boolean
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Pickup requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupRequest"
    post:
      operationId: createPickup
      tags: [pickups]
      summary: Create a pickup request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}:
    get:
      operationId: getPickup
      tags: [pickups]
      summary: Get a pickup request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pickup request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePickup
      tags: [pickups]
      summary: Update pickup verification details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}/contact-attempt:
    post:
      operationId: logPickupContactAttempt
      tags: [pickups]
      summary: Log a contact attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupContactAttemptInput"
      responses:
        "200":
          description: Updated pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}/dispatch:
    post:
      operationId: dispatchPickup
      tags: [pickups]
      summary: Dispatch a verified pickup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dispatched pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"
        "409":
          description: Verification requirements are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchBlockedResponse"

  /pickups/{id}/outcome:
    post:
      operationId: recordPickupOutcome
      tags: [pickups]
      summary: Record a pickup outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupOutcomeInput"
      responses:
        "200":
          description: Updated pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}/complete:
    post:
      operationId: completePickup
      tags: [pickups]
      summary: Complete a pickup and create intake inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupCompleteInput"
      responses:
        "200":
          description: Completed pickup and created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupCompletionResponse"

  /pickups/{id}/route:
    post:
      operationId: assignPickupRoute
      tags: [pickups]
      summary: Assign a confirmed pickup to a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRouteInput"
      responses:
        "200":
          description: Updated pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}/flags:
    post:
      operationId: createPickupFlag
      tags: [flags]
      summary: Flag a phone number or address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupFlagInput"
      responses:
        "201":
          description: Flagged pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /flags:
    get:
      operationId: listPickupFlags
      tags: [flags]
      summary: List pickup flags
      responses:
        "200":
          description: Pickup flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupFlag"

  /flags/{id}:
    patch:
      operationId: updatePickupFlag
      tags: [flags]
      summary: Update flag supervisor approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupFlagUpdate"
      responses:
        "200":
          description: Updated flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupFlag"

  /confirmation-template:
    get:
      operationId: getConfirmationTemplate
      tags: [pickups]
      summary: Get the pickup confirmation template
      responses:
        "200":
          description: Confirmation template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationTemplate"
    put:
      operationId: updateConfirmationTemplate
      tags: [pickups]
      summary: Update the pickup confirmation template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationTemplateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationTemplate"
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200": { description: Accounts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RecipientAccount" } } } } }
    post:
      operationId: createAccount
      tags: [accounts]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecipientAccountInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RecipientAccount" } } } }
  /claims:
    get:
      operationId: listClaims
      tags: [claims]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [submitted, verified, approved, fulfilled, rejected, cancelled] } }
        - { name: accountId, in: query, schema: { type: string } }
        - { name: itemId, in: query, schema: { type: string } }
        - { name: itemStage, in: query, schema: { type: string, enum: [intake, qc, storage, distributed] } }
      responses:
        "200": { description: Claims, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Claim" } } } } }
    post:
      operationId: createClaim
      tags: [claims]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
  /claims/{id}/evidence:
    post:
      operationId: addClaimEvidence
      tags: [claims]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEvidenceInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEvidence" } } } }
  /claims/{id}:
    get:
      operationId: getClaim
      tags: [claims]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Claim detail, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimDetail" } } } }
  /claims/{id}/status:
    patch:
      operationId: transitionClaim
      tags: [claims]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusTransitionInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
  /transfers:
    get:
      operationId: listTransfers
      tags: [transfers]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [planned, released, received, cancelled] } }
        - { name: accountId, in: query, schema: { type: string } }
        - { name: itemId, in: query, schema: { type: string } }
        - { name: claimId, in: query, schema: { type: string } }
      responses:
        "200": { description: Transfers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transfer" } } } } }
    post:
      operationId: createTransfer
      tags: [transfers]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TransferInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
  /transfers/{id}/status:
    patch:
      operationId: transitionTransfer
      tags: [transfers]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusTransitionInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
  /transfers/{id}:
    get:
      operationId: getTransfer
      tags: [transfers]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Transfer detail, content: { application/json: { schema: { $ref: "#/components/schemas/TransferDetail" } } } }
components:
  schemas:
    RecipientAccount:
      type: object
      required: [id, name, type, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        contactName: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        contactPhone: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecipientAccountInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        contactName: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
    RecipientAccountSummary:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
    Claim:
      type: object
      required: [id, accountId, itemId, status, submittedBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        accountId: { type: string }
        itemId: { type: string }
        status: { type: string, enum: [submitted, verified, approved, fulfilled, rejected, cancelled] }
        submittedBy: { type: string }
        approvedBy: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClaimInput:
      type: object
      required: [accountId, itemId]
      properties:
        accountId: { type: string }
        itemId: { type: string }
        notes: { type: string }
    ClaimEvidence:
      type: object
      required: [id, claimId, kind, reference, note, createdBy, createdAt]
      properties:
        id: { type: string }
        claimId: { type: string }
        kind: { type: string, enum: [identity, eligibility, need] }
        reference: { type: string }
        note: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ClaimEvidenceInput:
      type: object
      required: [kind, reference, note]
      properties:
        kind: { type: string, enum: [identity, eligibility, need] }
        reference: { type: string, minLength: 1 }
        note: { type: string, minLength: 1 }
    ClaimHistoryEntry:
      type: object
      required: [id, claimId, toStatus, by, timestamp]
      properties:
        id: { type: string }
        claimId: { type: string }
        fromStatus: { type: ["string", "null"] }
        toStatus: { type: string }
        by: { type: string }
        notes: { type: ["string", "null"] }
        timestamp: { type: string, format: date-time }
    ItemSummary:
      type: object
      required: [id, itemId, name, stage]
      properties:
        id: { type: string }
        itemId: { type: string }
        name: { type: string }
        stage: { type: string }
    ClaimDetail:
      allOf:
        - $ref: "#/components/schemas/Claim"
        - type: object
          required: [evidence, history, account, item]
          properties:
            evidence: { type: array, items: { $ref: "#/components/schemas/ClaimEvidence" } }
            history: { type: array, items: { $ref: "#/components/schemas/ClaimHistoryEntry" } }
            account: { $ref: "#/components/schemas/RecipientAccountSummary" }
            item: { $ref: "#/components/schemas/ItemSummary" }
    Transfer:
      type: object
      required: [id, claimId, accountId, itemId, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        claimId: { type: string }
        accountId: { type: string }
        itemId: { type: string }
        status: { type: string, enum: [planned, released, received, cancelled] }
        releasedBy: { type: ["string", "null"] }
        receivedBy: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TransferInput:
      type: object
      required: [claimId, accountId, itemId]
      properties:
        claimId: { type: string }
        accountId: { type: string }
        itemId: { type: string }
        notes: { type: string }
    TransferHistoryEntry:
      type: object
      required: [id, transferId, toStatus, by, timestamp]
      properties:
        id: { type: string }
        transferId: { type: string }
        fromStatus: { type: ["string", "null"] }
        toStatus: { type: string }
        by: { type: string }
        notes: { type: ["string", "null"] }
        timestamp: { type: string, format: date-time }
    ClaimSummary:
      type: object
      required: [id, accountId, itemId, status]
      properties:
        id: { type: string }
        accountId: { type: string }
        itemId: { type: string }
        status: { type: string }
    TransferDetail:
      allOf:
        - $ref: "#/components/schemas/Transfer"
        - type: object
          required: [history, account, claim, item]
          properties:
            history: { type: array, items: { $ref: "#/components/schemas/TransferHistoryEntry" } }
            account: { $ref: "#/components/schemas/RecipientAccountSummary" }
            claim: { $ref: "#/components/schemas/ClaimSummary" }
            item: { $ref: "#/components/schemas/ItemSummary" }
    StatusTransitionInput:
      type: object
      required: [status]
      properties:
        status: { type: string }
        notes: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DonationItem:
      type: object
      required:
        - id
        - itemId
        - name
        - category
        - tier
        - condition
        - donor
        - stage
        - lotNumber
        - powerConnectionReading
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        itemId:
          type: string
          description: Human-readable ID in format DS-XXXX
        name:
          type: string
        category:
          type: string
        tier:
          type: string
          enum: [T, I, E, R]
          description: "T=Time, I=Intelligence, E=Energy, R=Resources"
        condition:
          type: string
          enum: [good, fair, poor]
        donor:
          type: string
