openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Donation Station API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: items
    description: Donation item operations
  - name: donors
    description: Donor operations
  - name: dashboard
    description: Dashboard and summary operations
  - name: community
    description: Private community member history and staff-mediated ownership
  - name: routes
    description: Delivery route operations
  - name: pickups
    description: Donation pickup verification operations
  - name: flags
    description: Pickup phone and address flag operations
  - name: attend
    description: ATTEND allocation and delivery operations
paths:
  /con-scire/windows:
    get:
      operationId: getConScireWindows
      tags: [calendar]
      summary: Public Con-Scire cognitive calendar windows
      description: Scans UTC calendar dates, including today. Convergence is the digital root of attention plus intention plus purpose.
      security: []
      parameters:
        - name: stage
          in: query
          schema:
            type: string
            default: all
            enum: [all, intake, qc, storage, matched, scheduled, distributed, closed]
        - name: days
          in: query
          schema:
            type: string
            default: "30"
            pattern: "^([1-9]|[1-8][0-9]|90)$"
      responses:
        "200":
          description: Matching days for one or all lifecycle stages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConScireCalendar"
        "400":
          description: Invalid stage or days query parameter
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: List donation items
      parameters:
        - name: stage
          in: query
          schema:
            type: string
            enum: [intake, qc, storage, matched, scheduled, distributed, closed]
        - name: tier
          in: query
          schema:
            type: string
            enum: [T, I, E, R]
        - name: category
          in: query
          schema:
            type: string
        - name: temperatureZone
          in: query
          schema:
            type: string
            enum: [ambient, refrigerated, frozen]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonationItem"
    post:
      operationId: createItem
      tags: [items]
      summary: Create a new donation item (intake)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationItem"

  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get a donation item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Item found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationItemDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateItem
      tags: [items]
      summary: Update a donation item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Delete a donation item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /items/{id}/stage:
    patch:
      operationId: advanceItemStage
      tags: [items]
      summary: Advance item to a new stage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageAdvance"
      responses:
        "200":
          description: Stage updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /items/expiring:
    get:
      operationId: listExpiringItems
      tags: [items]
      summary: List items with expiry urgency
      responses:
        "200":
          description: Expiring items grouped by urgency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiringItemsResponse"

  /donors:
    get:
      operationId: listDonors
      tags: [donors]
      summary: List donors with computed lifecycle stage
      parameters:
        - name: stage
          in: query
          schema:
            type: string
            enum: [prospect, first-gift, active, lapsing, lapsed, reactivated]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of donors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Donor"
    post:
      operationId: createDonor
      tags: [donors]
      summary: Create a donor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donor"

  /donors/{id}:
    get:
      operationId: getDonor
      tags: [donors]
      summary: Get a donor by ID, including the items they've given
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Donor found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonorDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Dashboard summary data
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /community/history:
    get:
      operationId: getCommunityHistory
      tags: [community]
      summary: Get the signed-in community member's verified service history
      description: >
        Returns only records linked to the authenticated Clerk identity by
        staff mediation. Public tracking codes are not accepted as ownership proof.
      responses:
        "200":
          description: Private personal service history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityHistory"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Community role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /community/ownership:
    get:
      operationId: listCommunityOwnerships
      tags: [community]
      summary: List verified ownership links for a community member
      description: Staff-only lookup by verified Clerk user ID.
      parameters:
        - name: clerkUserId
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Existing ownership links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityOwnership"
        "400":
          description: Clerk user ID is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: linkCommunityOwnership
      tags: [community]
      summary: Link a verified record to a community member
      description: Staff-only mediation endpoint. Never infer ownership from public tracking codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityOwnershipInput"
      responses:
        "201":
          description: Ownership link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityOwnership"
        "400":
          description: Invalid ownership link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Clerk user or target record was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Record is already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /community/ownership/candidates:
    get:
      operationId: listCommunityOwnershipCandidates
      tags: [community]
      summary: Search records available for verified ownership linking
      description: Staff-only record picker for community ownership mediation.
      parameters:
        - name: recordType
          in: query
          required: true
          schema:
            type: string
            enum: [account, donation, claim, appointment, pickup_request, service_activity]
        - name: search
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityOwnershipCandidate"
        "400":
          description: Valid record type is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /community/ownership/{id}:
    delete:
      operationId: unlinkCommunityOwnership
      tags: [community]
      summary: Remove a staff-mediated community ownership link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Ownership link removed }
        "404":
          description: Ownership link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /routes:
    get:
      operationId: listRoutes
      tags: [routes]
      summary: List delivery routes
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryRoute"
    post:
      operationId: createRoute
      tags: [routes]
      summary: Create a delivery route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRouteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"

  /routes/{id}:
    get:
      operationId: getRoute
      tags: [routes]
      summary: Get a delivery route by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Route found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRouteDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRoute
      tags: [routes]
      summary: Update a delivery route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRouteUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRoute"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRoute
      tags: [routes]
      summary: Delete a delivery route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pickups:
    get:
      operationId: listPickups
      tags: [pickups]
      summary: List pickup requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [unverified, contact_made, confirmed, dispatched, completed, no_show, false_address, cancelled, closed_no_response]
        - name: flagged
          in: query
          schema:
            type: boolean
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Pickup requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupRequest"
    post:
      operationId: createPickup
      tags: [pickups]
      summary: Create a pickup request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}:
    get:
      operationId: getPickup
      tags: [pickups]
      summary: Get a pickup request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pickup request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePickup
      tags: [pickups]
      summary: Update pickup verification details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}/contact-attempt:
    post:
      operationId: logPickupContactAttempt
      tags: [pickups]
      summary: Log a contact attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupContactAttemptInput"
      responses:
        "200":
          description: Updated pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}/dispatch:
    post:
      operationId: dispatchPickup
      tags: [pickups]
      summary: Dispatch a verified pickup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dispatched pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"
        "409":
          description: Verification requirements are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchBlockedResponse"

  /pickups/{id}/outcome:
    post:
      operationId: recordPickupOutcome
      tags: [pickups]
      summary: Record a pickup outcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupOutcomeInput"
      responses:
        "200":
          description: Updated pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}/complete:
    post:
      operationId: completePickup
      tags: [pickups]
      summary: Complete a pickup and create intake inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupCompleteInput"
      responses:
        "200":
          description: Completed pickup and created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupCompletionResponse"

  /pickups/{id}/route:
    post:
      operationId: assignPickupRoute
      tags: [pickups]
      summary: Assign a confirmed pickup to a route
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRouteInput"
      responses:
        "200":
          description: Updated pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /pickups/{id}/flags:
    post:
      operationId: createPickupFlag
      tags: [flags]
      summary: Flag a phone number or address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupFlagInput"
      responses:
        "201":
          description: Flagged pickup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupRequestDetail"

  /flags:
    get:
      operationId: listPickupFlags
      tags: [flags]
      summary: List pickup flags
      responses:
        "200":
          description: Pickup flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickupFlag"

  /flags/{id}:
    patch:
      operationId: updatePickupFlag
      tags: [flags]
      summary: Update flag supervisor approval
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupFlagUpdate"
      responses:
        "200":
          description: Updated flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupFlag"

  /confirmation-template:
    get:
      operationId: getConfirmationTemplate
      tags: [pickups]
      summary: Get the pickup confirmation template
      responses:
        "200":
          description: Confirmation template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationTemplate"
    put:
      operationId: updateConfirmationTemplate
      tags: [pickups]
      summary: Update the pickup confirmation template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationTemplateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationTemplate"
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
      responses:
        "200": { description: Accounts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RecipientAccount" } } } } }
    post:
      operationId: createAccount
      tags: [accounts]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RecipientAccountInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RecipientAccount" } } } }
  /claims:
    get:
      operationId: listClaims
      tags: [claims]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [submitted, verified, approved, fulfilled, rejected, cancelled] } }
        - { name: accountId, in: query, schema: { type: string } }
        - { name: itemId, in: query, schema: { type: string } }
        - { name: itemStage, in: query, schema: { type: string, enum: [intake, qc, storage, matched, scheduled, distributed, closed] } }
      responses:
        "200": { description: Claims, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Claim" } } } } }
    post:
      operationId: createClaim
      tags: [claims]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
  /claims/{id}/evidence:
    post:
      operationId: addClaimEvidence
      tags: [claims]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEvidenceInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimEvidence" } } } }
  /claims/{id}:
    get:
      operationId: getClaim
      tags: [claims]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Claim detail, content: { application/json: { schema: { $ref: "#/components/schemas/ClaimDetail" } } } }
  /claims/{id}/status:
    patch:
      operationId: transitionClaim
      tags: [claims]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusTransitionInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Claim" } } } }
  /transfers:
    get:
      operationId: listTransfers
      tags: [transfers]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [planned, released, received, cancelled] } }
        - { name: accountId, in: query, schema: { type: string } }
        - { name: itemId, in: query, schema: { type: string } }
        - { name: claimId, in: query, schema: { type: string } }
      responses:
        "200": { description: Transfers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Transfer" } } } } }
    post:
      operationId: createTransfer
      tags: [transfers]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TransferInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
  /transfers/{id}/status:
    patch:
      operationId: transitionTransfer
      tags: [transfers]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StatusTransitionInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Transfer" } } } }
  /transfers/{id}:
    get:
      operationId: getTransfer
      tags: [transfers]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Transfer detail, content: { application/json: { schema: { $ref: "#/components/schemas/TransferDetail" } } } }
  /attend/outbox:
    get:
      operationId: listAttendOutbox
      tags: [attend]
      summary: List ATTEND Google Sheets delivery status
      responses:
        "200":
          description: Recent ATTEND delivery status without event payloads or connector credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendOutboxEntry"
  /attend/alerts:
    get:
      operationId: listAttendDeliveryAlerts
      tags: [attend]
      summary: List supervisor alerts for exhausted ATTEND deliveries
      parameters:
        - name: acknowledgement
          in: query
          schema:
            type: string
            enum: [all, open, acknowledged]
            default: all
        - name: createdFrom
          in: query
          description: Include alerts created at or after this timestamp
          schema: { type: string, format: date-time }
        - name: createdTo
          in: query
          description: Include alerts created at or before this timestamp
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: number, minimum: 1, multipleOf: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: number, minimum: 1, maximum: 100, multipleOf: 1, default: 20 }
      responses:
        "200":
          description: Filtered ATTEND delivery alert history without event payloads, provider details, errors, or credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendDeliveryAlertPage"
  /attend/alerts/{id}:
    patch:
      operationId: acknowledgeAttendDeliveryAlert
      tags: [attend]
      summary: Acknowledge a supervisor ATTEND delivery alert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Acknowledged ATTEND delivery alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendDeliveryAlert"
        "404":
          description: ATTEND delivery alert not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/track/{trackingCode}:
    get:
      operationId: getPublicTracking
      tags: [attend]
      summary: Get PII-safe public claim tracking
      parameters:
        - name: trackingCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^DSC-[0-9]{6}$"
      responses:
        "200":
          description: Public claim tracking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrackingResponse"
        "404":
          description: Tracking record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/track/{trackingCode}/verification/request:
    post:
      operationId: requestPublicTrackingVerification
      tags: [attend]
      summary: Send a one-time SMS code for public claim tracking
      parameters:
        - name: trackingCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^DSC-[0-9]{6}$"
      responses:
        "200":
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrackingVerificationRequestResponse"
        "400":
          description: Verification is unavailable for this claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tracking record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Verification resend is temporarily limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrackingVerificationRateLimitResponse"
        "503":
          description: SMS delivery is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /public/track/{trackingCode}/verification/verify:
    post:
      operationId: verifyPublicTracking
      tags: [attend]
      parameters:
        - name: trackingCode
          in: path
          required: true
          schema:
            type: string
            pattern: "^DSC-[0-9]{6}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicTrackingVerificationInput"
      responses:
        "200":
          description: Public claim tracking with exact times after verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrackingResponse"
        "400":
          description: Invalid verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tracking record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Verification attempts are temporarily limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrackingVerificationRateLimitResponse"
  /public/impact-summary:
    get:
      operationId: getPublicImpactSummary
      tags: [attend]
      summary: Get aggregate-only public impact metrics
      responses:
        "200":
          description: Public aggregate impact summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicImpactSummary"
components:
  schemas:
    ConScireCalendar:
      type: object
      required: [days, startDate]
      properties:
        days:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 90
        startDate:
          type: string
          format: date-time
        stage:
          type: string
          enum: [intake, qc, storage, matched, scheduled, distributed, closed]
        windows:
          type: array
          items:
            $ref: "#/components/schemas/ConScireWindow"
        stages:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ConScireWindow"
    ConScireWindow:
      type: object
      required: [date, purposePosition, purposeName, stage, stageName, stageEtymology, aligned, convergence]
      properties:
        date:
          type: string
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        purposePosition:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 9
        purposeName:
          type: string
        stage:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 16
        stageName:
          type: string
        stageEtymology:
          type: string
        aligned:
          type: boolean
        convergence:
          type: number
          multipleOf: 1
          minimum: 1
          maximum: 9
    AttendOutboxEntry:
      type: object
      required: [id, eventType, aggregateType, aggregateId, dedupeKey, status, attempts, createdAt]
      properties:
        id: { type: string }
        eventType: { type: string }
        aggregateType: { type: string }
        aggregateId: { type: string }
        dedupeKey: { type: string }
        status: { type: string, enum: [pending, processing, failed, sent] }
        attempts: { type: number }
        lastError: { type: ["string", "null"] }
        nextRetryAt: { type: ["string", "null"], format: date-time }
        processingLeaseUntil: { type: ["string", "null"], format: date-time }
        sentAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AttendDeliveryAlert:
      type: object
      required: [id, outboxId, eventType, aggregateType, aggregateId, lastError, acknowledgedAt, acknowledgedBy, createdAt]
      properties:
        id: { type: string }
        outboxId: { type: string }
        eventType: { type: string }
        aggregateType: { type: string }
        aggregateId: { type: string }
        lastError: { type: string }
        acknowledgedAt: { type: ["string", "null"], format: date-time }
        acknowledgedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AttendDeliveryAlertSummary:
      type: object
      required: [id, acknowledgedAt, createdAt]
      properties:
        id: { type: string }
        acknowledgedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    AttendDeliveryAlertPage:
      type: object
      required: [items, page, pageSize, totalItems, totalPages, hasPreviousPage, hasNextPage]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttendDeliveryAlertSummary"
        page: { type: number, multipleOf: 1 }
        pageSize: { type: number, multipleOf: 1 }
        totalItems: { type: number, multipleOf: 1 }
        totalPages: { type: number, multipleOf: 1 }
        hasPreviousPage: { type: boolean }
        hasNextPage: { type: boolean }
    RecipientAccount:
      type: object
      required: [id, name, type, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        contactName: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        contactPhone: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecipientAccountInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        contactName: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
    RecipientAccountSummary:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
    Claim:
      type: object
      required: [id, accountId, itemId, status, submittedBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        trackingCode: { type: string, nullable: true, pattern: "^DSC-[0-9]{6}$" }
        accountId: { type: string }
        itemId: { type: string }
        status: { type: string, enum: [submitted, verified, approved, fulfilled, rejected, cancelled] }
        submittedBy: { type: string }
        approvedBy: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicTrackingItem:
      type: object
      additionalProperties: false
      required: [categoryLabel, name]
      properties:
        categoryLabel: { type: string }
        name: { type: string }
    PublicTrackingTimelineEntry:
      type: object
      additionalProperties: false
      required: [label, approx, exact]
      properties:
        label: { type: string }
        approx: { type: string }
        exact: { type: ["string", "null"], format: date-time }
    PublicTrackingResponse:
      type: object
      additionalProperties: false
      required:
        - trackingCode
        - item
        - stage
        - status
        - lastUpdatedApprox
        - lastUpdatedExact
        - timeline
         - exactTimesLocked
      properties:
        trackingCode: { type: string, pattern: "^DSC-[0-9]{6}$" }
        item: { $ref: "#/components/schemas/PublicTrackingItem" }
        stage: { type: string }
        status: { type: string }
        lastUpdatedApprox: { type: string }
        lastUpdatedExact: { type: ["string", "null"], format: date-time }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/PublicTrackingTimelineEntry"
        exactTimesLocked: { type: boolean }
    PublicTrackingVerificationInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
    PublicTrackingVerificationRequestResponse:
      type: object
      additionalProperties: false
      required: [message, expiresInSeconds]
      properties:
        message: { type: string }
        expiresInSeconds: { type: number, minimum: 1, multipleOf: 1 }
    PublicTrackingVerificationRateLimitResponse:
      type: object
      additionalProperties: false
      required: [error, retryAfterSeconds]
      properties:
        error: { type: string }
        retryAfterSeconds: { type: number, minimum: 1, multipleOf: 1 }
    PublicImpactCategory:
      type: object
      additionalProperties: false
      required: [categoryLabel, count]
      properties:
        categoryLabel: { type: string }
        count: { type: number, minimum: 0, multipleOf: 1 }
    PublicImpactSummary:
      type: object
      additionalProperties: false
      required:
        - totalItemsReceived
        - totalItemsDistributed
        - itemsByCategory
        - claimsFulfilled
        - averageFulfillmentHours
      properties:
        totalItemsReceived: { type: number, minimum: 0, multipleOf: 1 }
        totalItemsDistributed: { type: number, minimum: 0, multipleOf: 1 }
        itemsByCategory:
          type: array
          items:
            $ref: "#/components/schemas/PublicImpactCategory"
        claimsFulfilled: { type: number, minimum: 0, multipleOf: 1 }
        averageFulfillmentHours: { type: ["number", "null"], minimum: 0 }
    ClaimInput:
      type: object
      required: [accountId, itemId]
      properties:
        accountId: { type: string }
        itemId: { type: string }
        notes: { type: string }
    ClaimEvidence:
      type: object
      required: [id, claimId, kind, reference, note, createdBy, createdAt]
      properties:
        id: { type: string }
        claimId: { type: string }
        kind: { type: string, enum: [identity, eligibility, need] }
        reference: { type: string }
        note: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ClaimEvidenceInput:
      type: object
      required: [kind, reference, note]
      properties:
        kind: { type: string, enum: [identity, eligibility, need] }
        reference: { type: string, minLength: 1 }
        note: { type: string, minLength: 1 }
    ClaimHistoryEntry:
      type: object
      required: [id, claimId, toStatus, by, timestamp]
      properties:
        id: { type: string }
        claimId: { type: string }
        fromStatus: { type: ["string", "null"] }
        toStatus: { type: string }
        by: { type: string }
        notes: { type: ["string", "null"] }
        timestamp: { type: string, format: date-time }
    ItemSummary:
      type: object
