        - warning
        - watch
      properties:
        expired:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringItem"
        critical:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringItem"
        warning:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringItem"
        watch:
