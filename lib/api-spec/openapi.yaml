      properties:
        name:
          type: string
        category:
          type: string
        tier:
          type: string
          enum: [T, I, E, R]
        condition:
          type: string
          enum: [good, fair, poor]
        donor:
          type: string
        recipient:
          type: string
        location:
          type: string
        expiryDate:
          type: string
          format: date
        temperatureZone:
          type: string
          enum: [ambient, refrigerated, frozen]
        weight:
          type: number
        origin:
          type: string
        lotNumber:
          type: string
        powerConnectionReading:
          type: string

    StageAdvance:
      type: object
      required:
        - stage
      properties:
        stage:
          type: string
          enum: [intake, qc, storage, matched, scheduled, distributed, closed]
        notes:
          type: string
        override:
          type: boolean
          default: false
        reason:
          type: string
          minLength: 1

    ExpiringItem:
      allOf:
        - $ref: "#/components/schemas/DonationItem"
